<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">i-Scream Media Q1 2026 Income Statement Flow</title>
  <desc id="description">A Sankey diagram showing i-Scream Media's Q1 2026 revenue by business segment and subsequent income statement flow.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f4; }
      .title { fill: #123d5a; font-family: Arial, sans-serif; font-size: 47px; font-weight: 700; }
      .subtitle { fill: #65727b; font-family: Arial, sans-serif; font-size: 18px; }
      .label { fill: #1f2d36; font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; }
      .value { fill: #1f2d36; font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; }
      .detail { fill: #65727b; font-family: Arial, sans-serif; font-size: 16px; }
      .note { fill: #65727b; font-family: Arial, sans-serif; font-size: 14px; }
      .node { stroke: #ffffff; stroke-width: 3; }
    </style>
    <linearGradient id="commerce" x1="0" x2="1"><stop offset="0" stop-color="#173b55" stop-opacity=".73"/><stop offset="1" stop-color="#254f68" stop-opacity=".68"/></linearGradient>
    <linearGradient id="publishing" x1="0" x2="1"><stop offset="0" stop-color="#57a969" stop-opacity=".73"/><stop offset="1" stop-color="#254f68" stop-opacity=".68"/></linearGradient>
    <linearGradient id="training" x1="0" x2="1"><stop offset="0" stop-color="#d7aa43" stop-opacity=".73"/><stop offset="1" stop-color="#254f68" stop-opacity=".68"/></linearGradient>
    <linearGradient id="gross" x1="0" x2="1"><stop offset="0" stop-color="#254f68" stop-opacity=".70"/><stop offset="1" stop-color="#43a35c" stop-opacity=".68"/></linearGradient>
    <linearGradient id="expense" x1="0" x2="1"><stop offset="0" stop-color="#43a35c" stop-opacity=".68"/><stop offset="1" stop-color="#d95550" stop-opacity=".70"/></linearGradient>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text x="65" y="76" class="title">아이스크림미디어 2026년 1분기 손익 흐름</text>
  <text x="67" y="108" class="subtitle">단위: 억원 | 별도 재무제표 | 2026.01.01 - 2026.03.31</text>
  <text x="65" y="165" class="label">어디서 돈을 벌었나</text>

  <path d="M 250 210 C 320 210, 350 290, 430 290 L 430 490 C 350 490, 320 410, 250 410 Z" fill="url(#commerce)"/>
  <path d="M 250 475 C 320 475, 350 490, 430 490 L 430 561 C 350 561, 320 546, 250 546 Z" fill="url(#publishing)"/>
  <path d="M 250 610 C 320 610, 350 561, 430 561 L 430 593 C 350 593, 320 642, 250 642 Z" fill="url(#training)"/>
  <path d="M 250 705 C 320 705, 350 593, 430 593 L 430 596 C 350 596, 320 708, 250 708 Z" fill="#d95550" fill-opacity=".7"/>
  <path d="M 462 290 C 560 290, 620 250, 730 250 L 730 435 C 620 435, 560 475, 462 475 Z" fill="url(#gross)"/>
  <path d="M 462 475 C 560 475, 620 475, 730 475 L 730 596 C 620 596, 560 596, 462 596 Z" fill="#dd8178" fill-opacity=".7"/>
  <path d="M 762 250 C 850 250, 910 230, 1010 230 L 1010 415 C 910 415, 850 435, 762 435 Z" fill="url(#expense)"/>
