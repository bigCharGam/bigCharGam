  <path d="M 1312 642 C 1380 642, 1415 649, 1500 649 L 1500 766 C 1415 766, 1380 759, 1312 759 Z" fill="#be3733" fill-opacity=".78"/>

  <rect x="218" y="210" width="32" height="200" rx="3" class="node" fill="#173b55"/>
  <rect x="218" y="475" width="32" height="71" rx="3" class="node" fill="#57a969"/>
  <rect x="218" y="610" width="32" height="32" rx="3" class="node" fill="#d7aa43"/>
  <rect x="218" y="705" width="32" height="3" rx="2" class="node" fill="#d95550"/>
  <rect x="430" y="290" width="32" height="306" rx="3" class="node" fill="#254f68"/>
  <rect x="730" y="250" width="32" height="185" rx="3" class="node" fill="#43a35c"/>
  <rect x="730" y="475" width="32" height="121" rx="3" class="node" fill="#d95550"/>
  <rect x="730" y="680" width="32" height="168" rx="3" class="node" fill="#d95550"/>
  <rect x="1010" y="230" width="55" height="383" rx="3" class="node" fill="#d9504b"/>
  <rect x="1280" y="625" width="32" height="146" rx="3" class="node" fill="#c84843"/>
  <rect x="1500" y="649" width="48" height="117" rx="3" class="node" fill="#b4312d"/>

  <text x="55" y="245" class="label">커머스</text><text x="55" y="278" class="value">99.8억원</text><text x="55" y="304" class="detail">65.3% | 아이스크림몰·하이스토어</text>
  <text x="55" y="455" class="label">교육출판</text><text x="55" y="488" class="value">35.4억원</text><text x="55" y="514" class="detail">23.1% | 교과서·교재·콘텐츠</text>
  <text x="55" y="590" class="label">연수사업</text><text x="55" y="623" class="value">16.2억원</text><text x="55" y="649" class="detail">10.6% | 교원 연수·위탁 연수</text>
  <text x="55" y="690" class="label">기타</text><text x="55" y="723" class="value">1.6억원</text><text x="55" y="749" class="detail">1.0%</text>

  <text x="446" y="254" text-anchor="middle" class="label">총매출</text><text x="446" y="286" text-anchor="middle" class="value">153.0억원</text><text x="446" y="620" text-anchor="middle" class="detail">전년 동기 대비 +14.6%</text>
  <text x="660" y="195" text-anchor="middle" class="label">매출총이익</text><text x="660" y="227" text-anchor="middle" class="value">92.3억원</text><text x="660" y="250" text-anchor="middle" class="detail">매출총이익률 60.4%</text>
  <text x="660" y="632" text-anchor="middle" class="label">매출원가</text><text x="660" y="664" text-anchor="middle" class="value">60.6억원</text><text x="660" y="688" text-anchor="middle" class="detail">매출의 39.6%</text>
  <text x="860" y="874" text-anchor="middle" class="label">영업손실 갭</text><text x="860" y="906" text-anchor="middle" class="value">84.3억원</text><text x="860" y="932" text-anchor="middle" class="detail">판관비가 매출총이익을 초과한 부분</text>
  <text x="1080" y="190" text-anchor="middle" class="label">판매비와관리비</text><text x="1080" y="222" text-anchor="middle" class="value">176.6억원</text><text x="1080" y="248" text-anchor="middle" class="detail">인건비 · R&amp;D · 지급수수료 등</text>
  <text x="1170" y="582" text-anchor="middle" class="label">영업손실</text><text x="1170" y="614" text-anchor="middle" class="value">84.3억원</text>
  <text x="1296" y="586" text-anchor="middle" class="label">세전손실</text><text x="1296" y="618" text-anchor="middle" class="value">72.5억원</text><text x="1296" y="797" text-anchor="middle" class="detail">금융·기타손익 순효과 +11.8억원</text>
  <text x="1524" y="610" text-anchor="middle" class="label">당기순손실</text><text x="1524" y="642" text-anchor="middle" class="value">73.4억원</text><text x="1524" y="793" text-anchor="middle" class="detail">기본 EPS -552원</text>
  <text x="65" y="960" class="note">출처: 아이스크림미디어 2026년 1분기 분기보고서. 반올림에 따라 합계와 차이가 있을 수 있습니다.</text>
</svg>